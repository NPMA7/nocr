services:
  postgres:
    image: postgres:18-alpine
    container_name: nocr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nocr}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - nocr-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-nocr}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nocr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nocr_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PORT:-9371}:9371"
    volumes:
      - ./data:/app/data
      - ./.wwebjs_auth:/app/.wwebjs_auth
    networks:
      - nocr-net

volumes:
  postgres_data:
    driver: local

networks:
  nocr-net:
    name: nocr-net
    driver: bridge
