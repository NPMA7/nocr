services:
  postgres:
    image: postgres:18-alpine
    container_name: nocr_postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      POSTGRES_DB: ${DB_NAME:-nocr}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-@pasha937110}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - nocr-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nocr"]
      interval: 5s
      timeout: 5s
      retries: 5

  nocr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nocr_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env.production
    ports:
      - "127.0.0.1:9371:9371"
    volumes:
      - ./backend/data:/app/backend/data
    networks:
      - nocr-net

volumes:
  postgres_data:
    driver: local

networks:
  nocr-net:
    name: nocr-net
    driver: bridge
