# Map Forwarded Proto for Cloudflare / Proxy
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# WebSocket connection upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream nocr_upstream {
    server 127.0.0.1:9371;
    keepalive 64;
}

# 1. Direct IP Access Block/Redirect
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/nocrnetwork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nocrnetwork.com/privkey.pem;

    return 301 https://nocrnetwork.com$request_uri;
}

# 2. Main Domain Reverse Proxy
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name nocrnetwork.com www.nocrnetwork.com;

    ssl_certificate /etc/letsencrypt/live/nocrnetwork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nocrnetwork.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;
    keepalive_timeout 75s;
    keepalive_requests 10000;

    location /uploads/ {
        alias /var/www/nocr/backend/data/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Next.js Static Chunks & Assets
    location /_next/static/ {
        proxy_pass http://nocr_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering on;
        proxy_buffers 16 128k;
        proxy_busy_buffers_size 256k;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # WebSocket support (Socket.IO)
    location /socket.io/ {
        proxy_pass http://nocr_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }

    # Main Application
    location / {
        proxy_pass http://nocr_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
